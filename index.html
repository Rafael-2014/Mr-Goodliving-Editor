  --bg:#f1f5f0; --card:#ffffff; --ink:#15241a; --mute:#63776a; --line:#d6e2d8;
  --g:#1f9d57; --g2:#17803f; --gs:#e2f5e9; --gl:#c5e9d1;
  --warn:#fff3d4; --warnt:#85570a; --err:#fde8e8; --errt:#b3261e;
  --s1:#d7f1f8; --s1t:#0b7f9f; --s2:#e1ebff; --s2t:#2d62d8; --s3:#ebe5ff; --s3t:#6445d0; --s4:#ffe8d6; --s4t:#bd5a12;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
button,.btn{font:inherit;font-weight:650;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  min-height:44px;padding:0 14px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:active,.btn:active{transform:scale(.98)}
button.pri,.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
button.pri:disabled{opacity:.45}
button.ghost{background:transparent}
button.sm{min-height:36px;padding:0 11px;font-size:13px;border-radius:10px}
input[type=search],select,input.nl{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;min-height:44px;padding:0 12px;width:100%}
select{width:auto}
:focus-visible{outline:3px solid var(--gl);outline-offset:1px}

/* topo */
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:3px solid var(--g);
  padding:max(10px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;width:38px;height:38px;border-radius:11px;background:var(--g);color:#fff;font-weight:800;font-size:19px;display:grid;place-items:center}
.brand h1{margin:0;font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--mute);font-size:12px}
.sp{flex:1}
.status{font-size:12px;color:var(--g2);background:var(--gs);border-radius:99px;padding:3px 10px;white-space:nowrap}

/* barra de ações: fixa embaixo no celular */
.actions button{white-space:nowrap;font-size:14px;padding:0 8px}
.hm{display:none}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:.85fr 1.25fr 1.1fr;gap:8px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1.5px solid var(--line)}
.actions.one{grid-template-columns:1fr}

main{max-width:1180px;margin:0 auto;padding:12px 12px 24px}
.hero{background:var(--card);border:2px dashed var(--gl);border-radius:20px;padding:34px 18px;text-align:center;margin-top:18px}
.hero .big{width:70px;height:70px;margin:0 auto 14px;border-radius:20px;background:var(--gs);color:var(--g2);display:grid;place-items:center;font-size:34px}
.hero h2{margin:0 0 6px;font-size:19px}.hero p{margin:0 0 18px;color:var(--mute)}
.hero .btn{min-height:50px;font-size:16px;padding:0 26px;max-width:100%}
.hero .btn.pri{overflow-wrap:anywhere}
.drop{border-color:var(--g);background:var(--gs)}

/* barra de busca / progresso */
.bar{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:12px}
.srow{display:flex;gap:8px}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;min-height:36px;padding:0 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:13px}
.chipb.on{background:var(--g);border-color:var(--g);color:#fff}
.prog{height:7px;border-radius:7px;background:var(--gs);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--g);transition:width .25s}
.cnt{font-size:12px;color:var(--mute);margin-top:6px;display:flex;justify-content:space-between;gap:8px}

.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;display:grid;gap:10px}
.sheet h3{margin:0;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1 1 120px}
.fl{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.help{font-size:12px;color:var(--mute)}
.rep{display:grid;gap:4px;font-size:12px}
.rep div{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:9px;padding:6px 9px}
.up{color:#c4620d;font-weight:700}.dn{color:var(--g2);font-weight:700}

.msg{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;white-space:pre-wrap;word-break:break-word;display:flex;gap:10px;align-items:flex-start}
.msg.good{background:var(--gs);color:var(--g2)}.msg.err{background:var(--err);color:var(--errt)}
.msg span{flex:1}.msg button{min-height:28px;padding:0 8px;border:0;background:transparent;color:inherit;font-size:18px}

/* cartões */
#rows{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 230px}
.card.done{border-color:var(--gl)}.card.bad{border-color:#f1b5b0}
.rh{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:#f7faf7;border-bottom:1.5px solid var(--line)}
.card.done .rh{background:var(--gs)}.card.bad .rh{background:#fff4f2}
.chip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--gs);color:var(--g2)}
.chip.id{background:var(--ink);color:#fff}.chip.m{background:var(--bg);color:var(--mute)}
.grow{flex:1}
.sz{font-size:12px;color:var(--mute)}.sz b{color:var(--ink)}
.rw{padding:8px 12px;background:var(--warn);color:var(--warnt);font-size:12px;font-weight:600}
.rw.raw{background:var(--s3);color:var(--s3t)}
.pair{display:grid;grid-template-columns:1fr;gap:10px;padding:11px 12px;border-top:1px dashed var(--line)}
.rh+.pair,.rw+.pair{border-top:0}
.top2{display:flex;gap:6px;align-items:center;margin-bottom:5px;font-size:11px;color:var(--mute);font-weight:600}
.ot{background:var(--bg);border-radius:11px;padding:9px 11px;white-space:pre-wrap;word-break:break-word;min-height:40px}
.st{padding:1px 9px;border-radius:99px;font-weight:800;font-size:11px}
.s1{background:var(--s1);color:var(--s1t)}.s2{background:var(--s2);color:var(--s2t)}
.s3{background:var(--s3);color:var(--s3t)}.s4{background:var(--s4);color:var(--s4t)}.s0{background:var(--bg);color:var(--mute)}
.tk{display:inline-block;min-width:22px;text-align:center;padding:0 6px;margin:0 1px;border-radius:7px;font-size:12px;font-weight:800;line-height:20px;vertical-align:1px;cursor:pointer;user-select:none}
textarea{width:100%;display:block;resize:none;overflow:hidden;font:inherit;font-size:16px;padding:10px 12px;min-height:58px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px}
textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--gs);outline:none}
.pair.ok textarea{border-color:var(--gl);background:#fbfffc}
.tm{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12px;color:var(--mute)}
.tm .bad{color:var(--errt);font-weight:700}
.tm a{cursor:pointer;font-weight:700;color:var(--g2);padding:6px 2px}
.tm label{display:flex;align-items:center;gap:6px}
input.nl{width:62px;min-height:38px;padding:0 8px;border-radius:10px}
.pv{margin-top:5px;font-size:13px;color:var(--mute);white-space:pre-wrap}
.only{color:var(--mute);font-size:12px;padding:6px 0}
.more{display:flex;justify-content:center;padding:14px 0}
.more button{min-width:220px}
.empty{padding:30px 10px;text-align:center;color:var(--mute)}
.spin{width:30px;height:30px;border:4px solid var(--gs);border-top-color:var(--g);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* telas maiores: original | tradução lado a lado, ações no topo */
@media(min-width:900px){
  body{padding-bottom:30px}
  .actions{position:static;display:flex;border:0;padding:0;background:none;margin-left:auto}
  .actions button,.actions .btn{min-height:40px;font-size:15px;padding:0 14px}
  .hm{display:inline;white-space:pre}
  .actions.one{display:flex}
  .pair{grid-template-columns:1fr 1fr;gap:16px}
  header.top{padding:10px 22px}
  main{padding:18px 22px 40px}
  .bar{display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:10px 16px;align-items:center}
  .bar .chips{margin-top:0}.bar .prog,.bar .cnt{grid-column:1/-1}
}
